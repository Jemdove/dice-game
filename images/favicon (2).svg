<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- back die (white), small and tilted right, peeking out behind -->
  <g transform="rotate(16 45 20)">
    <rect x="31" y="6" width="28" height="28" rx="7" fill="#ffffff" stroke="#232931" stroke-width="3"/>
    <circle cx="38.5" cy="13.5" r="3.3" fill="#232931"/>
    <circle cx="51.5" cy="26.5" r="3.3" fill="#232931"/>
  </g>

  <!-- front die (teal), big and tilted left: shows a 3 -->
  <g transform="rotate(-9 27 39)">
    <rect x="6" y="18" width="42" height="42" rx="10" fill="#4ECCA3" stroke="#232931" stroke-width="4"/>
    <circle cx="16.5" cy="28.5" r="5.2" fill="#232931"/>
    <circle cx="27" cy="39" r="5.2" fill="#232931"/>
    <circle cx="37.5" cy="49.5" r="5.2" fill="#232931"/>
  </g>
</svg>
